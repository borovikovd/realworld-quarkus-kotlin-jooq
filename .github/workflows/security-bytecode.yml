name: "Security / Bytecode"

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  spotbugs:
    name: SpotBugs + FindSecBugs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Run SpotBugs
        run: chmod +x gradlew && ./gradlew spotbugsMain --no-daemon

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spotbugs-reports
          path: build/reports/spotbugs/

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: build/reports/spotbugs/main.sarif
          category: spotbugs
